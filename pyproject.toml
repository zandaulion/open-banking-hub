[project]
name = "bankhub"
version = "0.1.0"
description = "Self-hosted, read-only view of your own bank accounts (Enable Banking PSD2), with a phone app and a redacted MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["open banking", "psd2", "enable banking", "personal finance", "mcp", "self-hosted"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42",
    "pyyaml>=6",
    "typer>=0.12",
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebpush>=2.5",
]

[project.urls]
Homepage = "https://github.com/zandaulion/open-banking-hub"
Issues = "https://github.com/zandaulion/open-banking-hub/issues"
Changelog = "https://github.com/zandaulion/open-banking-hub/blob/main/CHANGELOG.md"

[project.scripts]
bankhub = "bankhub.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
