# Default rules. Put your own in $BANKHUB_DATA_DIR/categories.yaml (same format):
# its entries are checked first and extend these defaults.
#
# Patterns match case-insensitively against "counterparty name | description".
# A plain pattern is a substring; prefix with "re:" for a regular expression.
# Only merchants listed here are ever shown by name to agents and reports.
# Bank transfers match on the counterparty name only, never the description.
# card_only: the name is also a first name, so it never matches bank transfers.

