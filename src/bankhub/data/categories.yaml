# Keyword rules set a category WITHOUT naming the payee: for small local
# businesses and practices named after people. Checked after merchants.
category_rules:
  - {category: health, subcategory: pharmacy, patterns: ["re:\\bfarm(acia)?\\b", "pharma", "apotheke"]}
  - {category: health, subcategory: clinic, patterns: ["clinic", "medical", "re:\\bcmi\\b", "re:\\bdr\\.? ", "dent", "spital", "hospital", "ambulator", "laborator", "genetrix"]}
  - {category: restaurants, patterns: ["restaurant", "ristorante", "bistro", "trattoria", "pizz", "kebab", "kebap", "shaorma", "burger", "sushi", "fish bar", "tapa", "comida", "china town", "cantina", "cartofi", "re:\\bpub\\b", "brasserie"]}
  - {category: restaurants, subcategory: cafes, patterns: ["cafe", "coffee", "cofetari", "patiseri", "brutari", "bakery", "boulangerie"]}
  - {category: groceries, patterns: ["supermarket", "market", "markt", "macelar", "alimentar"]}
  - {category: travel, subcategory: accommodation, patterns: ["hotel", "hostel", "motel", "pensiun", "damage deposit"]}
  - {category: travel, subcategory: agency, patterns: ["travel", "re:\\btours?\\b"]}
  - {category: travel, subcategory: airport, patterns: ["aeroport", "airport"]}
  - {category: transport, subcategory: parking, patterns: ["parking", "parcare"]}
  - {category: transport, subcategory: fuel, patterns: ["oil&gas", "petrol", "benzin", "carburant"]}
  - {category: taxes, patterns: ["impozit", "directia generala", "primaria", "municipiul", "imprimeria nationala", "re:^ukvi\\b"]}
  - {category: entertainment, subcategory: tickets, patterns: ["ticket", "bilet", "event", "candlelight"]}
  - {category: entertainment, subcategory: culture, patterns: ["muzeu", "museum", "teatr", "theatre", "re:\\bzoo\\b", "biblioteca"]}
  - {category: sports, patterns: ["climb", "fitness", "re:\\bgym\\b", "swim", "re:\\bski\\b", "piscina"]}
  - {category: education, patterns: ["language", "scoala", "school", "academ", "bartending"]}
  - {category: shopping, subcategory: books, patterns: ["librari", "books", "buchhandlung"]}
  - {category: shopping, subcategory: gifts, patterns: ["flowers", "florari", "souvenir"]}
  - {category: charity, patterns: ["fundatia", "foundation", "asociatia"]}

# The bank's own transaction type, where it carries the meaning (ING Romania sends one; Revolut does not).
# Checked before merchants. internal: money between your own accounts or term deposits.
bank_code_rules:
  - {codes: ["Deposit creation", "Deposit closing", "Unauthorised negative balance set-off"], internal: true}
  - {codes: ["Credit Repayment", "Recalculation to loan account"], direction: debit, category: loans, subcategory: repayment}
  - {codes: ["Loan disbursement"], direction: credit, category: loans, subcategory: disbursement}
  - {codes: ["Interest adjustment"], direction: debit, category: loans, subcategory: interest}
  - {codes: ["Interest adjustment", "Deposit account interest"], direction: credit, category: income, subcategory: interest}
  - {codes: ["Life insurance premium (credits)"], direction: debit, category: insurance, subcategory: loan_life}
  - {codes: ["Service Fees", "Fee", "Fee for Movable Publicity Register", "Cancellation fee of NRMP registration"], direction: debit, category: fees}
  - {codes: ["Cash withdrawal", "Cash withdrawal RON wallet ATM ING"], direction: debit, category: cash}
  # BRD (the first part of its description)
  - {codes: ["re:schimb valutar"], internal: true}
  - {codes: ["Plata dobanda limita credit"], direction: debit, category: loans, subcategory: interest}
  - {codes: ["Plata dobanda cont curent", "re:^plata dobanda"], direction: credit, category: income, subcategory: interest}
  - {codes: ["Plata impozit"], direction: debit, category: taxes, subcategory: interest_tax}
  - {codes: ["re:^retrageri? de numerar"], direction: debit, category: cash}
  - {codes: ["re:^comision"], direction: debit, category: fees}

# Descriptions meaning money moved between your own accounts at the same bank,
# even when the other side is not visible (e.g. Revolut pockets and savings).
own_account_patterns:
  # Applied only when the other side has no account identifier (no IBAN or
  # bank id), so a person called "Ron" paid by transfer never matches.
  Revolut:
    - "re:^(to|from) (ron|eur|usd|gbp|chf|huf|pln|czk|sek|nok|dkk|try|aed|jpy|cad|aud)\\b"
    - "re:^exchanged to [a-z]{3}\\b"
    - "re:^(to|from) savings account\\b"
    - "re:^top-up by \\*\\d{4}"                # loading Revolut from your own card at another bank
    - "re:^(google|apple) pay top-up by \\*\\d{4}"   # the same, through a phone wallet
  Demo Card Bank:                                   # the made-up banks of `bankhub demo`
    - "re:^top-up by \\*\\d{4}"
    - "re:^to ron savings\\b"
  BRD:
    - "re:^revolut\\*\\*"                       # card payment loading your Revolut account

# Generic labels for counterparties that are never named.
labels:
  cash_withdrawal: ["re:\\batm\\b", "cash withdrawal", "retragere numerar", "re:^cash at"]
  bank_fee: ["re:\\bfee\\b", "comision", "re:\\btaxa\\b"]
  refund: ["re:^refund"]
  interest: ["re:^interest", "dobanda", "re:\\binterest earned"]
